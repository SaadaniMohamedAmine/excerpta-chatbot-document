<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-width=1.0" name="viewport"/>
<title>Excerpta - Export Conversation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Source+Serif+4:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#90a8ff",
                        "on-secondary-fixed": "#261a00",
                        "surface-container-low": "#f2f4f6",
                        "surface": "#f7f9fb",
                        "inverse-primary": "#b6c4ff",
                        "on-surface": "#191c1e",
                        "secondary-fixed-dim": "#f1bf4f",
                        "tertiary-fixed": "#ffdbcb",
                        "on-tertiary-container": "#f39461",
                        "on-background": "#191c1e",
                        "on-tertiary-fixed-variant": "#773205",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary": "#00236f",
                        "on-error-container": "#93000a",
                        "secondary": "#795900",
                        "error-container": "#ffdad6",
                        "outline": "#757682",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed-variant": "#264191",
                        "tertiary": "#4b1c00",
                        "primary-fixed": "#dce1ff",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#341100",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-surface-variant": "#444651",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "primary-container": "#1e3a8a",
                        "secondary-fixed": "#ffdf9f",
                        "surface-dim": "#d8dadc",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#fdca59",
                        "on-primary-fixed": "#00164e",
                        "surface-tint": "#4059aa",
                        "tertiary-fixed-dim": "#ffb691",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed-variant": "#5c4300",
                        "surface-container-high": "#e6e8ea",
                        "tertiary-container": "#6e2c00",
                        "surface-bright": "#f7f9fb",
                        "background": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#735500",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c5c5d3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "workspace_gap": "1px",
                        "xl": "32px",
                        "sm": "8px",
                        "2xl": "48px",
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-mono": ["Geist Mono"],
                        "h1": ["Geist"],
                        "body-excerpt": ["\"Source Serif 4\""],
                        "h1-mobile": ["Geist"],
                        "caption": ["Geist"],
                        "body-ui": ["Geist"],
                        "h2": ["Geist"],
                        "display-wordmark": ["\"Source Serif 4\""]
                    },
                    "fontSize": {
                        "label-mono": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "h1": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-excerpt": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "h1-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-ui": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "h2": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-wordmark": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface dark:bg-inverse-surface min-h-screen flex items-center justify-center font-body-ui text-body-ui text-on-surface dark:text-inverse-on-surface antialiased overflow-hidden">
<!-- Background Workspace Mockup (Context) -->
<div class="fixed inset-0 z-0 flex blur-sm opacity-50 select-none pointer-events-none">
<div class="w-1/3 border-r border-workspace_gap border-outline-variant dark:border-outline p-lg">
<div class="font-h2 text-h2 mb-md">Chat History</div>
<div class="space-y-sm">
<div class="h-12 bg-surface-variant dark:bg-inverse-surface rounded opacity-20"></div>
<div class="h-12 bg-surface-variant dark:bg-inverse-surface rounded opacity-20"></div>
<div class="h-12 bg-surface-variant dark:bg-inverse-surface rounded opacity-20"></div>
</div>
</div>
<div class="w-2/3 p-lg">
<div class="h-8 w-1/2 bg-surface-variant dark:bg-inverse-surface mb-lg rounded opacity-20"></div>
<div class="space-y-md">
<div class="h-4 bg-surface-variant dark:bg-inverse-surface rounded opacity-20"></div>
<div class="h-4 bg-surface-variant dark:bg-inverse-surface rounded opacity-20 w-5/6"></div>
<div class="h-4 bg-surface-variant dark:bg-inverse-surface rounded opacity-20 w-4/6"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/60 z-40 backdrop-blur-[2px] transition-opacity"></div>
<!-- Modal Content -->
<div class="relative z-50 w-full max-w-md bg-surface dark:bg-[#131B2E] border border-workspace_gap border-outline-variant dark:border-outline rounded shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
<!-- Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-workspace_gap border-outline-variant dark:border-outline">
<h2 class="font-h2 text-h2 text-on-surface dark:text-primary-fixed-dim">Export Conversation</h2>
<button aria-label="Close" class="text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg space-y-md">
<p class="font-body-ui text-body-ui text-on-surface-variant dark:text-surface-variant mb-xl">
                Choose a format to export your synthesis and chat history. Citations and highlighted excerpts will be preserved.
            </p>
<!-- Export Options -->
<div class="space-y-sm">
<!-- Option: PDF -->
<label class="flex items-start gap-md p-md border border-workspace_gap border-outline-variant dark:border-outline rounded cursor-pointer hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors group">
<div class="flex items-center h-full pt-1">
<input checked="" class="w-4 h-4 text-primary dark:text-primary-fixed-dim bg-surface dark:bg-inverse-surface border-outline-variant dark:border-outline focus:ring-primary dark:focus:ring-primary-fixed focus:ring-offset-surface dark:focus:ring-offset-inverse-surface" name="export_format" type="radio" value="pdf"/>
</div>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-on-surface dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
<span class="font-label-mono text-label-mono text-on-surface dark:text-inverse-on-surface uppercase tracking-wider">PDF Document</span>
</div>
<p class="font-caption text-caption text-on-surface-variant dark:text-surface-variant">Best for sharing fixed-layout research and printing.</p>
</div>
</label>
<!-- Option: DOCX -->
<label class="flex items-start gap-md p-md border border-workspace_gap border-outline-variant dark:border-outline rounded cursor-pointer hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors group">
<div class="flex items-center h-full pt-1">
<input class="w-4 h-4 text-primary dark:text-primary-fixed-dim bg-surface dark:bg-inverse-surface border-outline-variant dark:border-outline focus:ring-primary dark:focus:ring-primary-fixed focus:ring-offset-surface dark:focus:ring-offset-inverse-surface" name="export_format" type="radio" value="docx"/>
</div>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-on-surface dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="font-label-mono text-label-mono text-on-surface dark:text-inverse-on-surface uppercase tracking-wider">Word Document</span>
</div>
<p class="font-caption text-caption text-on-surface-variant dark:text-surface-variant">Best for further editing and collaborative review.</p>
</div>
</label>
</div>
<!-- Metadata Options -->
<div class="mt-lg pt-md border-t border-workspace_gap border-outline-variant dark:border-outline">
<label class="flex items-center gap-sm cursor-pointer group">
<input checked="" class="w-4 h-4 rounded-sm text-primary dark:text-primary-fixed-dim bg-surface dark:bg-inverse-surface border-outline-variant dark:border-outline focus:ring-primary dark:focus:ring-primary-fixed focus:ring-offset-surface dark:focus:ring-offset-inverse-surface" type="checkbox"/>
<span class="font-caption text-caption text-on-surface dark:text-inverse-on-surface group-hover:text-primary dark:group-hover:text-primary-fixed-dim transition-colors">Include document citations metadata</span>
</label>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md bg-surface-container-low dark:bg-[#0f1524] border-t border-workspace_gap border-outline-variant dark:border-outline flex justify-end items-center gap-md">
<button class="font-label-mono text-label-mono text-on-surface-variant dark:text-surface-variant hover:text-on-surface dark:hover:text-inverse-on-surface transition-colors px-md py-sm">
                Cancel
            </button>
<button class="font-label-mono text-label-mono bg-primary dark:bg-primary-fixed-dim text-on-primary dark:text-on-primary-fixed px-lg py-sm rounded hover:opacity-90 active:scale-95 transition-all flex items-center gap-sm shadow-sm shadow-primary/20">
<span class="material-symbols-outlined text-[16px]">download</span>
                Export
            </button>
</div>
</div>
</body></html>
