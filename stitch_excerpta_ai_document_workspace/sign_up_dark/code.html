<body class="bg-inverse-surface min-h-screen flex items-center justify-center p-md">
<div class="w-full max-w-md bg-[#131B2E] border border-outline/30 rounded-lg p-xl flex flex-col gap-lg shadow-2xl relative overflow-hidden">
<!-- Subtle decorative glow -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-primary-fixed-dim/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex flex-col items-center gap-sm text-center z-10">
<h1 class="font-display-wordmark text-display-wordmark text-primary-fixed-dim">Excerpta</h1>
<h2 class="font-h1 text-h1 text-surface">Create an account</h2>
<p class="font-body-ui text-body-ui text-surface-variant">Join the focused environment for deep synthesis.</p>
</div>
<form class="flex flex-col gap-md z-10">
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-surface-variant uppercase tracking-wider" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">person</span>
<input class="w-full bg-[#1A233A] border border-outline/30 rounded focus:border-primary-fixed-dim focus:ring-0 text-surface font-body-ui text-body-ui pl-10 pr-3 py-2 transition-colors placeholder-outline" id="name" placeholder="Dr. Jane Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">mail</span>
<input class="w-full bg-[#1A233A] border border-outline/30 rounded focus:border-primary-fixed-dim focus:ring-0 text-surface font-body-ui text-body-ui pl-10 pr-3 py-2 transition-colors placeholder-outline" id="email" placeholder="jane.doe@university.edu" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">lock</span>
<input class="w-full bg-[#1A233A] border border-outline/30 rounded focus:border-primary-fixed-dim focus:ring-0 text-surface font-body-ui text-body-ui pl-10 pr-10 py-2 transition-colors placeholder-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary-fixed-dim transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<p class="font-caption text-caption text-outline mt-1">Must be at least 8 characters long.</p>
</div>
<button class="w-full bg-primary-fixed-dim text-on-primary-fixed font-h2 text-h2 py-3 rounded mt-sm hover:bg-primary-fixed transition-colors flex justify-center items-center gap-sm" type="submit">
                Create account
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center py-sm z-10">
<div class="flex-grow border-t border-outline/30"></div>
<span class="flex-shrink-0 mx-4 font-caption text-caption text-surface-variant">or continue with</span>
<div class="flex-grow border-t border-outline/30"></div>
</div>
<div class="flex gap-md z-10">
<button class="flex-1 bg-[#1A233A] border border-outline/30 rounded py-2 flex justify-center items-center gap-sm hover:bg-[#1A233A]/80 hover:border-primary-fixed-dim transition-colors text-surface font-label-mono text-label-mono" type="button">
<!-- Google Icon Placeholder -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"></path></svg>
                Google
            </button>
<button class="flex-1 bg-[#1A233A] border border-outline/30 rounded py-2 flex justify-center items-center gap-sm hover:bg-[#1A233A]/80 hover:border-primary-fixed-dim transition-colors text-surface font-label-mono text-label-mono" type="button">
<!-- ORCID Icon Placeholder (Generic Academic Icon) -->
<span class="material-symbols-outlined" style="font-size: 20px;">school</span>
                Institution
            </button>
</div>
<p class="text-center font-body-ui text-body-ui text-surface-variant mt-sm z-10">
            Already have an account? <a class="text-primary-fixed-dim hover:underline font-h2 text-h2 text-[16px]" href="#">Sign in</a>
</p>
</div>
